
[project]
name = "ecoguard-ai"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "PyJWT[crypto]>=2.8",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pypdf>=4.0",
    "reportlab>=4.0",
    "requests>=2.31",
    "vercel-blob>=0.5.0",
    "truststore>=0.10.0; python_version >= '3.10'",
    "beautifulsoup4>=4.12",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "langsmith>=0.1",
]

[tool.vercel]
entrypoint = "api.main:app"
